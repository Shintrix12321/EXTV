<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXTV — Anime</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1012;color:#f5f5f5;font-family:Arial,sans-serif}header{position:sticky;top:0;background:#101114f5;border-bottom:1px solid #292a2e;z-index:5}.bar,main{max-width:1400px;margin:auto}.bar{padding:10px 22px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:22px}.logo span{color:#ff4d5e}.search{flex:1;max-width:650px;background:#18191c;border:1px solid #303238;border-radius:8px;padding:11px 14px;color:#fff;outline:0}.search:focus{border-color:#ff4d5e}button{font:inherit;cursor:pointer;border:1px solid #303238;background:#18191c;color:#f5f5f5;border-radius:8px;padding:10px 14px}.primary{background:#ff4d5e;color:#111;font-weight:700}main{padding:20px 22px}.hero{padding:30px;border:1px solid #303238;border-radius:14px;background:linear-gradient(110deg,#28181e,#17181c 55%,#111214)}h1{margin:0 0 10px;font-size:clamp(28px,4vw,46px)}p{color:#a6a7ad;line-height:1.55}.actions{display:flex;gap:10px;margin-top:18px}.status{text-align:center;color:#a6a7ad;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:22px}.card{background:#18191c;border:1px solid #303238;border-radius:10px;overflow:hidden;text-decoration:none;color:#f5f5f5}.card:hover{border-color:#ff4d5e}.cover{aspect-ratio:2/3;background:#24252a}.cover img{width:100%;height:100%;object-fit:cover}.ct{padding:11px 12px}.ct b{display:block;min-height:38px;line-height:1.35}.ct small{display:block;color:#a6a7ad;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pages{display:flex;justify-content:center;gap:8px;margin:26px 0}.spin{display:inline-block;width:24px;height:24px;border:3px solid #555;border-top-color:#ff4d5e;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.bar{padding:9px 12px}.bar button{display:none}main{padding:14px 12px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}</style></head><body><header><div class="bar"><div class="logo">EXT<span>V</span></div><input id="search" class="search" placeholder="Поиск аниме..." autocomplete="off"><button id="random">Случайное</button></div></header><main><section class="hero"><h1>Аниме с настоящими обложками</h1><p>Реальный каталог из MyAnimeList через Jikan API. Обложки не генерируются ИИ.</p><div class="actions"><button id="popular" class="primary">Популярные</button><button id="retry">Повторить</button></div></section><div id="status" class="status"><span class="spin"></span><br>Загружаем каталог…</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div><p>Источник каталога: MyAnimeList через Jikan API.</p></main><script>const API='https://api.jikan.moe/v4/anime',g=id=>document.getElementById(id);let page=1,last=1,q='';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function card(a){let img=a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'',e=document.createElement('a');e.className='card';e.target='_blank';e.rel='noreferrer';e.href='https://myanimelist.net/anime/'+a.mal_id;e.innerHTML='<div class="cover">'+(img?'<img loading="lazy" src="'+img+'" alt="'+esc(a.title)+'">':'')+'</div><div class="ct"><b>'+esc(a.title)+'</b><small>'+esc([a.year,a.type,a.score?'★ '+a.score.toFixed(1):''].filter(Boolean).join(' · '))+'</small></div>';return e}async function load(query='',p=1){q=query;page=p;g('grid').innerHTML='';g('pages').innerHTML='';g('status').style.display='block';g('status').innerHTML='<span class="spin"></span><br>Загружаем каталог…';try{let u=new URL(API);u.searchParams.set('page',p);u.searchParams.set('limit',24);u.searchParams.set('sfw','true');u.searchParams.set('order_by','score');u.searchParams.set('sort','desc');if(query.trim())u.searchParams.set('q',query.trim());let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),a=j.data||[];last=j.pagination?.last_visible_page||1;if(!a.length){g('status').textContent='Ничего не найдено.';return}g('status').style.display='none';a.forEach(x=>g('grid').appendChild(card(x)));let b=document.createElement('button');b.textContent='← Назад';b.disabled=p<=1;b.onclick=()=>load(q,p-1);let n=document.createElement('button');n.textContent='Дальше →';n.disabled=p>=last;n.onclick=()=>load(q,p+1);let i=document.createElement('span');i.className='status';i.style.padding='10px';i.textContent='Страница '+p+' из '+last;g('pages').append(b,i,n)}catch(e){g('status').innerHTML='Не удалось загрузить каталог: '+esc(e.message)+'<br><br><button class="primary" onclick="load(q,page)">Повторить</button>'}}let timer;g('search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>load(e.target.value,1),450)};g('popular').onclick=()=>load('',1);g('retry').onclick=()=>load(q,page);g('random').onclick=async()=>{try{let r=await fetch(API+'?page=1&limit=24&sfw=true&order_by=score&sort=desc'),j=await r.json(),a=j.data[Math.floor(Math.random()*j.data.length)];location.href='https://myanimelist.net/anime/'+a.mal_id}catch{}};load();</script></body></html>
